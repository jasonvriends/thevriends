#-------------------------------
# General Site Settings
baseURL = "http://thevriends.com/"
languageCode = "en-us"
title = "Jason Vriends"
googleAnalytics = "" # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Pagination settings:

# For Hugo versions 0.128.0 and above, use the following settings:
# This will set the number of items per page for newer versions.
[pagination]
  pagerSize = 5

# For Hugo versions below 0.128.0, uncomment the line below and comment out the [pagination] block above:
#paginate = 5 # Sets the number of items per page for older versions.


[params]
  logo = "" # You can add own logo. For example "/images/logo.png".
  description = "Exploring faith and tech for a better tomorrow."
  color_scheme = "auto" # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the user can choose the light or dark mode themself.


#-------------------------------
# Main Menu
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "Sermons"
    url = "/tags/sermons/"
    weight = 3

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4


  #-------------------------------
  # Author Settings
  [params.author]
    author__name = "Jason Vriends"
    author__bio = "A Lay Pastor with Canadian Baptists of Ontario and Quebec and Senior IT Strategist."
    author__avatar = "/images/avatar.jpg"

  # Social Links
  [[params.social]]
    icon = "ion-logo-twitter"
    name = "Twitter"
    link = "https://x.com/JasonVriends"

  [[params.social]]
    icon = "ion-logo-github"
    name = "Github"
    link = "https://github.com/jasonvriends"

  [[params.social]]
    icon = "ion-logo-youtube"
    name = "Youtube"
    link = "https://www.youtube.com/@JasonVriends"

  # Other icons can be found at https://ionicons.com/v4/


  #-------------------------------
  # Hero Settings
  [params.hero]
    enable = true
    hero__title = "Hey everyone, I'm Jason Vriends"
    hero__description = "—"
    hero__rotating_descriptions = [
      "Lay Pastor",
      "IT Strategist",
      "Flight Enthusiast",
      "Keto Advocate"
    ]
    hero__role_descriptions = [
      "Serving with the Canadian Baptists of Ontario and Quebec.",
      "Helping organizations thrive in the digital age.",
      "Exploring the virtual skies of Microsoft Flight Simulator and X-Plane.",
      "Promoting health and wellness through lifestyle."
    ]
    hero__image = "/images/home/home-hero.png"


    #-------------------------------
    # Logos Settings
    [params.logos]
      enable = true
      logos__title = "I've worked with some great сompanies"

    [[params.logo_item]]
      name = "Treasury Board of Canada Secretariat"
      link = "https://www.canada.ca/en/treasury-board-secretariat.html"
      image = "/images/home/work_tbs.png"

    [[params.logo_item]]
      name = "Employment and Social Development Canada"
      link = "https://www.canada.ca/en/employment-social-development.html"
      image = "/images/home/work_esdc.png"

    [[params.logo_item]]
      name = "Canada Revenue Agency"
      link = "https://www.canada.ca/en/revenue-agency.html"
      image = "/images/home/work_cra.png"

    [[params.logo_item]]
      name = "Shared Services Canada"
      link = "https://www.canada.ca/en/shared-services.html"
      image = "/images/home/work_ssc.png"

    [[params.logo_item]]
      name = "Lanark County Interval House and Community Support"
      link = "https://lcih.org/"
      image = "/images/home/work_lcih.png"

  #-------------------------------
  # Newsletter Settings
  [params.mailchimp]
    enable = false
    mailchimp__identifier = "frnla.us6.list-manage.com/subscribe/post?u=6314d69a3f315af7ce3fb00a0&amp;id=3038727cc3" # Add your MailChimp form identifier. For example - frnla.us6.list-manage.com/subscribe/post?u=6314d69a3f315af7ce3fb00a0&amp;id=3038727cc3
    mailchimp__input__text = "Your email address..."
    mailchimp__button__text = "Subscribe" # Add your button text


  #-------------------------------
  # Work Settings
  [params.work]
    enable = false
    work__title= "Work"
    work__description= "I shows only the best websites and portfolios built completely with passion, simplicity & creativity!"


